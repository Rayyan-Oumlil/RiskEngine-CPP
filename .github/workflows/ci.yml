name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-linux:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          else
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRISKENGINE_BUILD_BENCH=ON
      - name: Build
        # Capped at 2: GitHub-hosted runners have 2 cores / ~7 GB RAM, and unlimited
        # --parallel lets enough heavy C++ translation units overlap to OOM-kill cc1plus.
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with ASan/UBSan
        run: |
          CC=clang CXX=clang++ cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug -DRISKENGINE_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DRISKENGINE_BUILD_SERVER=ON -DRISKENGINE_BUILD_TESTS=OFF \
            -DRISKENGINE_BUILD_EXPERIMENTS=OFF -DRISKENGINE_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build --target riskengine_server --parallel 2

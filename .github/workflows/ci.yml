name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-linux:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          else
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRISKENGINE_BUILD_BENCH=ON
      - name: Build
        # Capped at 2: GitHub-hosted runners have 2 cores / ~7 GB RAM, and unlimited
        # --parallel lets enough heavy C++ translation units overlap to OOM-kill cc1plus.
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with ASan/UBSan
        run: |
          CC=clang CXX=clang++ cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug -DRISKENGINE_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  simd-avx2:
    # Builds the AVX2 kernels and runs the whole suite, golden values included: the vectorized
    # paths must reproduce the committed results bit for bit, not approximately.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRISKENGINE_ENABLE_AVX2=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  simd-avx512:
    # The same suite, 8 lanes wide. Hosted runners may lack AVX-512: then the SIMD, Longstaff-
    # Schwartz, golden-value and determinism tests run under Intel SDE, which emulates AVX-512.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect AVX-512
        id: cpu
        run: |
          if grep -qw avx512f /proc/cpuinfo; then echo "native=true" >> "$GITHUB_OUTPUT"; else echo "native=false" >> "$GITHUB_OUTPUT"; fi
          grep -m1 "model name" /proc/cpuinfo
      - name: Configure
        # Catch2 normally runs the test binary at build time to list its tests: on a runner without
        # AVX-512 that is an illegal instruction. PRE_TEST lists them when ctest runs instead.
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRISKENGINE_ENABLE_AVX512=ON             -DRISKENGINE_BUILD_EXPERIMENTS=OFF -DRISKENGINE_BUILD_EXAMPLES=OFF             -DCMAKE_CATCH_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test (native AVX-512)
        if: steps.cpu.outputs.native == 'true'
        run: ctest --test-dir build --output-on-failure
      - name: Set up Intel SDE
        if: steps.cpu.outputs.native != 'true'
        uses: petarpetrovt/setup-sde@v2.4
      - name: Test (emulated AVX-512)
        if: steps.cpu.outputs.native != 'true'
        run: '"$SDE_PATH/sde64" -icx -- build/tests/riskengine_tests "[simd],[lsm],[golden],[determinism]"'

  python-bindings:
    # Builds `import riskengine` (nanobind) and runs its pytest suite and the Python quickstart.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install numpy pytest
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRISKENGINE_BUILD_PYTHON=ON             -DRISKENGINE_BUILD_TESTS=OFF -DRISKENGINE_BUILD_EXPERIMENTS=OFF -DRISKENGINE_BUILD_EXAMPLES=OFF             -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
      - name: Build
        run: cmake --build build --config Release --target riskengine_python --parallel 2
      - name: Test
        shell: bash
        run: PYTHONPATH=build/python python -m pytest -q python/tests
      - name: Example
        shell: bash
        run: PYTHONPATH=build/python python examples/quickstart.py

  thread-sanitizer:
    # ThreadSanitizer over the whole suite: the multithreaded Longstaff-Schwartz (std::barrier per
    # date), the block-parallel Monte Carlo engine, and the thread-count determinism tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow TSan's memory layout
        # Ubuntu 24.04 runners randomize mmap with more bits than TSan supports.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: |
          CC=clang CXX=clang++ cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo             -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread             -DRISKENGINE_BUILD_EXPERIMENTS=OFF -DRISKENGINE_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DRISKENGINE_BUILD_SERVER=ON -DRISKENGINE_BUILD_TESTS=OFF \
            -DRISKENGINE_BUILD_EXPERIMENTS=OFF -DRISKENGINE_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build --target riskengine_server --parallel 2
